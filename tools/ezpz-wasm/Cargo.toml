[package]
name = "ezpz-wasm"
version = "0.1.0"
edition = "2021"
description = "C-ABI shim exposing the EZPZ geometric constraint solver to Java (via Chicory WebAssembly runtime)"

[lib]
# cdylib => the .wasm with a plain C ABI. We deliberately do NOT use wasm-bindgen:
# Java (Chicory) can only call raw exports, not the JS glue wasm-bindgen generates.
# rlib => so `cargo test` can link the same exports and pin the ABI offline.
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# `panic = "abort"` in the release profile is incompatible with the test harness, so
# tests run under the dev profile where unwinding is available.

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
ezpz = "0.2.29"
# faer 的矩阵乘走 gemm，而 gemm 在 wasm 上**默认开启 simd128**（不是按 target feature 判定，
# 而是一个常量 DEFAULT_WASM_SIMD128 = true）。必须在初始化时关掉它，否则 wasm 里会执行
# V128_* 指令，而 Chicory 的默认解释器不支持，会抛
# "Machine doesn't recognize Instruction ... V128_LOAD"。
# 版本要跟随 faer 0.24 实际拉取的版本（0.19.x），否则关的不是同一个实例。
gemm-common = "0.19"
# pulp 是 faer 的 SIMD 层，**它有自己的开关**，和 gemm 那个是两回事：
# 只关一个另一个照旧执行 V128_*。两个都必须在初始化时关掉。
pulp-wasm-simd-flag = { version = "0.1.1", default-features = false }
